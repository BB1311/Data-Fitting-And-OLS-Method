[pytest]
# Thư mục chứa test
testpaths = unit_tests
 
# Chỉ nhận các file/class/hàm theo pattern chuẩn
python_files   = test_*.py
python_classes = Test*
python_functions = test_*
 
# Thêm thư mục gốc project vào sys.path để import part1.*
pythonpath = .
 
# Hiển thị thông tin assertion đầy đủ hơn
addopts =
    -v
    --tb=short
    --strict-markers
 